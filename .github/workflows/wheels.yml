name: Wheels

# Every wheel and the sdist are built on one Linux runner (a wheel is a repackaging of conda-forge's CalculiX: any
# machine builds any platform's), then each wheel is installed and tested on its own platform, and the sdist is
# built into a wheel to prove it builds. Everything is published to PyPI through trusted publishing (the `pypi`
# environment; no token is stored) by a v* tag whose version matches the package's, or by running the workflow on
# main with `publish` set, which publishes the package's version and then tags the commit v<version> itself.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this commit of main to PyPI as the package's version, and tag it v<version>.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install the build tools
        run: python -m pip install build "hatchling>=1.27"
      - name: Build every platform's wheel and the sdist
        run: |
          for platform in linux-64 linux-aarch64 osx-64 osx-arm64 win-64; do
            CCX_PLATFORM=$platform python -m build --wheel --no-isolation --outdir dist .
          done
          python -m build --sdist --no-isolation --outdir dist .
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test:
    name: Test (${{ matrix.platform }}, Python ${{ matrix.python }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-64, runner: ubuntu-latest, python: "3.9" }
          - { platform: linux-64, runner: ubuntu-latest, python: "3.14" }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm, python: "3.12" }
          - { platform: osx-64, runner: macos-15-intel, python: "3.12" }
          - { platform: osx-arm64, runner: macos-latest, python: "3.12" }
          - { platform: win-64, runner: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # pip takes the one wheel this platform can install, from the built ones alone.
      - name: Install this platform's wheel
        run: |
          python -m pip install --only-binary :all: --no-index --find-links dist cad-ccx
          python -m pip install pytest
      - name: Test it
        run: python -m pytest -q tests

  sdist:
    name: Build a wheel from the sdist
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Build and install it
        run: |
          python -m pip wheel --no-deps --wheel-dir built dist/cad_ccx-*.tar.gz
          python -m pip install built/cad_ccx-*.whl
          ccx -v | grep "Version 2.23"

  publish:
    name: Publish to PyPI
    needs: [build, test, sdist]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: write  # the tag a dispatched publish makes
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: The release is the package's version, and not one already tagged
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME is not v$version"; exit 1; }
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" > /dev/null 2>&1; then
            echo "v$version is tagged already: bump the version to publish this commit"; exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
      # A dispatched publish tags what it published. A tag the workflow's token makes starts no run of its own.
      - name: Tag the published commit
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/v${{ steps.version.outputs.version }}" -f "sha=$GITHUB_SHA"
